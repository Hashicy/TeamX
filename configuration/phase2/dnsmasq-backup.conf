# CN Project - Phase 2 - BACKUP private DNS (Mac 4)
# Extension A: same project records as the primary on Mac 1.
# Keep the address= and local-ttl lines identical to dnsmasq-primary.conf.

# Listen on Mac 4's LAN address
listen-address=10.7.12.123

# Only answer DNS queries on the configured interface
interface=en0
bind-interfaces

# Project DNS records -> edge (Mac 2)
# Extension E (edge migration): change both lines to the standby edge IP (Mac 3: 10.7.7.136)
address=/app.teamX.test/10.7.8.105
address=/api.teamX.test/10.7.8.105

# Extension B: TTL for our own records
local-ttl=30

# Don't read /etc/resolv.conf
no-resolv

# Forward all other DNS queries to public DNS
server=8.8.8.8
server=1.1.1.1

# Cache DNS responses
cache-size=1000
