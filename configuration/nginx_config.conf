events {
    worker_connections 1024;
}

http {
    upstream backend_cluster {
        # Round-robin load balancing between Mac 3 and Mac 4
        server 10.7.7.136:3001;
        server 10.7.12.123:3002;
    }

    server {
        listen 443 ssl;
        server_name app.teamX.test;

        # TLS certificate paths
        ssl_certificate /opt/homebrew/etc/nginx/certs/app.teamX.test.pem;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.teamX.test-key.pem;

        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Task F: Add Cache-Control header for caching demonstrations
            # Hide the backend's copy so clients get a single Cache-Control header
            proxy_hide_header Cache-Control;
            add_header Cache-Control "max-age=60";
        }
    }
}
